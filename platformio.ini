; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = 12h Wordclock ESP8266 WROOM2 module

[env:esp_wroom_02]
platform = espressif8266
board = esp_wroom_02
board_build.flash_mode = qio
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.2m512.ld
framework = arduino
monitor_speed = 115200
upload_speed = 57600
upload_protocol = espota
upload_port = wordclock.local
; falls OTA-Passwort gesetzt:
; upload_flags = --auth=DEIN_PASSWORT
lib_deps =
	makuna/RTC@^2.3.6
	arduino-libraries/NTPClient@^3.2.1
	adafruit/Adafruit NeoPixel@^1.11.0
	claws/BH1750@^1.3.0
	me-no-dev/ESPAsyncTCP@^1.2.2
	me-no-dev/ESPAsyncWebServer@^3.6.0
	ipdotsetaf/ESPAsyncHTTPUpdateServer@^3.0.0
