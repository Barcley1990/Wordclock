; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = 12h Wordclock ESP8266 WROOM2 module
default_envs = esp_wroom_02

[env:esp_wroom_02]
platform = espressif8266
board = esp_wroom_02
board_build.flash_mode = qio
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.2m512.ld
framework = arduino
; Stage filesystem OTA before eboot copies it; do not overwrite a mounted FS.
build_flags = -DATOMIC_FS_UPDATE
monitor_speed = 115200
upload_speed = 57600
upload_protocol = espota
upload_port = wordclock.local
; falls OTA-Passwort gesetzt:
; upload_flags = --auth=DEIN_PASSWORT
lib_deps =
	makuna/RTC@^2.3.6
	arduino-libraries/NTPClient@^3.2.1
	adafruit/Adafruit NeoPixel@^1.11.0
	claws/BH1750@^1.3.0
	ESP32Async/ESPAsyncTCP@2.0.0
	me-no-dev/ESPAsyncWebServer@3.6.0

; Native Apple Silicon compiler; no Rosetta required.
[env:esp_wroom_02_macos_arm64]
extends = env:esp_wroom_02
platform = espressif8266@4.2.1
platform_packages =
	toolchain-xtensa @ https://github.com/esphome-libs/xtensa-lx106-elf-toolchain/releases/download/10.3.0-esphome.3/toolchain-xtensa-lx106-elf-10.3.0-esphome.3-darwin_arm64.tar.gz
extra_scripts = post:scripts/native_mklittlefs.py
