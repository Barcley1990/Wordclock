<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wordclock Settings</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="wrap">
      <nav class="menu">
        <a class="menu-link" href="/">Home</a>
        <a class="menu-link" href="/color.html">Color Settings</a>
        <a class="menu-link active" href="/settings.html">Settings</a>
      </nav>
      <h1>Settings</h1>
      <form id="auto-form" class="form">
        <label>
          <input id="auto-enabled" name="auto_brightness_enabled" type="checkbox" />
          Enable Auto Brightness
        </label>
        <label>
          Ambient Lux Min
          <input id="auto-lux-low" name="auto_lux_low" type="number" min="0" step="0.1" value="5.0" />
        </label>
        <label>
          Ambient Lux Max
          <input id="auto-lux-high" name="auto_lux_high" type="number" min="0" step="0.1" value="300.0" />
        </label>
        <label>
          Clock Brightness Min
          <input id="auto-brightness-min" name="auto_brightness_min" type="number" min="1" max="255" value="12" />
        </label>
        <label>
          Clock Brightness Max
          <input id="auto-brightness-max" name="auto_brightness_max" type="number" min="1" max="255" value="127" />
        </label>
        <button type="submit">Save Auto Brightness</button>
      </form>
      <div class="status" id="auto-status">Loading settings...</div>

      <form id="reset-form" class="form">
        <button type="submit">Reset Controller</button>
      </form>
      <div class="status" id="reset-status">Ready</div>
    </main>
    <script src="/settings.js"></script>
  </body>
</html>
